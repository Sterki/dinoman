name: diabetes

services:

  # ── Frontend: Vite dev server con Hot Module Replacement ─────────────────────
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app                    # código fuente en tiempo real
      - frontend_node_modules:/app/node_modules  # node_modules aislado en volumen
    ports:
      - "5173:5173"                        # acceso directo a Vite (opcional, dev only)
    networks:
      - app

  # ── Backend: PHP 8.4-FPM (Symfony) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app                     # código fuente en tiempo real
      - backend_vendor:/app/vendor         # vendor instalado en el contenedor
      - backend_var:/app/var               # caché y logs de Symfony
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  # ── Nginx: reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # datos persistentes
    ports:
      - "5432:5432"                              # acceso desde el host (dev)
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:
    driver: bridge

volumes:
  postgres_data:           # datos de PostgreSQL — persisten entre reinicios
  frontend_node_modules:   # node_modules del frontend — instalados en el contenedor
  backend_vendor:          # vendor de Composer — instalado en el contenedor
  backend_var:             # var/ de Symfony (caché, logs)
